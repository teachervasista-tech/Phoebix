<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fa">
    <meta name="description" content="A pharmacy-first sales, inventory and customer management workspace for India.">
    <link rel="stylesheet" href="styles.css">
    <title>Phoebix — Pharmacy workspace</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#" data-page="dashboard" aria-label="Phoebix home">
          <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M13.5 4h5v9h9v5h-9v9h-5v-9h-9v-5h9z"/></svg></span>
          <span><strong>Phoebix</strong><small>PHARMACY OS</small></span>
        </a>
        <div class="store-switch"><span class="store-icon">✳</span><span><b data-store-name>Greenleaf Pharmacy</b><small><span data-store-city>Hyderabad</span> · <span data-store-branch>Store 01</span></small></span><span class="chevron">⌄</span></div>
        <div class="nav-caption">WORKSPACE</div>
        <nav class="main-nav" aria-label="Main navigation">
          <a class="nav-link active" href="#" data-page="dashboard"><span class="nav-icon">▦</span>Overview</a>
          <a class="nav-link" href="#" data-page="sales"><span class="nav-icon">▤</span>Point of sale <kbd>⌘ 1</kbd></a>
          <a class="nav-link" href="#" data-page="inventory"><span class="nav-icon">▣</span>Inventory <span class="nav-count" id="inventory-badge"></span></a>
          <a class="nav-link" href="#" data-page="customers"><span class="nav-icon">♙</span>Customers</a>
          <a class="nav-link" href="#" data-page="rewards"><span class="nav-icon">✧</span>Rewards & offers</a>
          <a class="nav-link" href="#" data-page="reports"><span class="nav-icon">▥</span>Reports</a>
          <a class="nav-link" href="#" data-page="users" id="nav-users" hidden><span class="nav-icon">♔</span>Users & access</a>
        </nav>
        <div class="sidebar-bottom">
          <div class="support-card"><span class="support-spark">✳</span><b>Need a hand?</b><p>Your pharmacy's next best move starts here.</p><button class="text-button" id="help-button">Visit help centre <span>↗</span></button></div>
          <a class="nav-link settings-link" href="#" id="settings-button"><span class="nav-icon">⚙</span>Settings</a>
          <div class="profile"><div class="avatar avatar-plum" id="profile-avatar"></div><span><b id="profile-name"></b><small id="profile-role"></small></span><button aria-label="Account and sign out" title="Account and sign out" class="more-button" id="account-button">···</button></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Open menu">☰</button>
          <div class="breadcrumb"><span data-store-name>Greenleaf Pharmacy</span><span class="crumb-slash">/</span><b id="page-crumb">Overview</b></div>
          <div class="topbar-actions">
            <label class="global-search"><span>⌕</span><input id="global-search" placeholder="Search anything..." autocomplete="off"><kbd>⌘ K</kbd></label>
            <span class="today-label" id="today-label"></span>
            <span class="database-status connecting" id="database-status" role="status" title="Checking the pharmacy database"><i></i><span>Connecting</span></span>
            <button class="icon-button notification-button" aria-label="Notifications">♧<i></i></button>
            <div class="avatar avatar-plum top-avatar" id="top-avatar"></div>
          </div>
        </header>
        <div id="app-content" class="page-content"></div>
      </main>
    </div>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <div id="modal-root"></div>
    <div id="login-root"></div>
    <script src="app.js" defer></script>
  </body>
</html>
